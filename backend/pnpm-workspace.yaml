# pnpm 11 supply-chain settings.
# mongodb-memory-server is deliberately NOT allowed to run its postinstall: it would
# download a mongod binary. Tests point MONGOMS_SYSTEM_BINARY at the system mongod.
allowBuilds:
  '@firebase/util': true
  argon2: true
  esbuild: true
  mongodb-memory-server: false
  protobufjs: true
minimumReleaseAgeExclude:
  - '@biomejs/biome@2.6.3'
  - '@biomejs/cli-android-arm64@2.6.3'
  - '@biomejs/cli-android-x64@2.6.3'
  - '@biomejs/cli-darwin-arm64@2.6.3'
  - '@biomejs/cli-darwin-x64@2.6.3'
  - '@biomejs/cli-linux-arm64-musl@2.6.3'
  - '@biomejs/cli-linux-arm64@2.6.3'
  - '@biomejs/cli-linux-x64-musl@2.6.3'
  - '@biomejs/cli-linux-x64@2.6.3'
  - '@biomejs/cli-win32-arm64@2.6.3'
  - '@biomejs/cli-win32-x64@2.6.3'
